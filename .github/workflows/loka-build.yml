name: Loka build

# Loka's own build: the same build and zip as a local alpha (scripts/loka_build.py, then browser:package), uploaded as
# a run artifact. Nothing is released. Started by hand.
# GitHub's free Windows runners (4 CPUs, free for this public repo) stop a job at 6 hours, so the build runs in
# chained stages, as Helium's main.yml does: each builds for 5.5 hours, then saves the tree for the next
# (.github/actions/loka-stage). A larger runner label finishes in fewer stages.
# Helium's main.yml can't make Loka: it doesn't build Loka's pages or apply its brand, and its packaging requires the
# Azure signing secrets.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (windows-2025 is GitHub's free runner)
        required: false
        default: windows-2025
      version:
        description: LOKA_VERSION for the zip (empty is 0.1.0-ci.<run number>)
        required: false
        default: ''
      ssh:
        description: If a stage fails, keep its runner up for SSH (tmate, only you can join)
        type: boolean
        default: false

permissions:
  contents: read

env:
  LOKA_VERSION: ${{ inputs.version || format('0.1.0-ci.{0}', github.run_number) }}

jobs:
  stage-1:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/loka-stage
        id: stage
        with:
          resume: false
          ssh: ${{ inputs.ssh }}

  stage-2:
    needs: stage-1
    if: needs.stage-1.outputs.finished == 'false'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/loka-stage
        id: stage
        with:
          resume: true
          ssh: ${{ inputs.ssh }}

  stage-3:
    needs: stage-2
    if: needs.stage-2.outputs.finished == 'false'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/loka-stage
        id: stage
        with:
          resume: true
          ssh: ${{ inputs.ssh }}

  stage-4:
    needs: stage-3
    if: needs.stage-3.outputs.finished == 'false'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/loka-stage
        id: stage
        with:
          resume: true
          ssh: ${{ inputs.ssh }}

  stage-5:
    needs: stage-4
    if: needs.stage-4.outputs.finished == 'false'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/loka-stage
        id: stage
        with:
          resume: true
          ssh: ${{ inputs.ssh }}

  stage-6:
    needs: stage-5
    if: needs.stage-5.outputs.finished == 'false'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/loka-stage
        id: stage
        with:
          resume: true
          ssh: ${{ inputs.ssh }}

  stage-7:
    needs: stage-6
    if: needs.stage-6.outputs.finished == 'false'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/loka-stage
        id: stage
        with:
          resume: true
          ssh: ${{ inputs.ssh }}

  stage-8:
    needs: stage-7
    if: needs.stage-7.outputs.finished == 'false'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/loka-stage
        id: stage
        with:
          resume: true
          ssh: ${{ inputs.ssh }}
