<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Loka prototype</title>
		<style>
			/* Registered so anything drawn before a space's hue is set gets Loka's default blue. */
			@property --hue {
				syntax: "<number>";
				inherits: true;
				initial-value: 200;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: #0b0c10;
				font: 13px/1.4 system-ui, "Segoe UI", sans-serif;
				-webkit-font-smoothing: antialiased;
			}
		</style>
		<script type="module" src="/src/main.ts"></script>
	</head>
	<body>
		<loka-app></loka-app>
	</body>
</html>
