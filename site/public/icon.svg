<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
	<title>Loka</title>
	<!-- Loka's mark: a world cut by the sidebar line. Left slice is the sidebar, lit in the space colors; right is the page. -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#14212f" />
			<stop offset="1" stop-color="#07080c" />
		</linearGradient>
		<linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#8ae8ff" />
			<stop offset="0.5" stop-color="#5ab0ff" />
			<stop offset="1" stop-color="#ffa45c" />
		</linearGradient>
		<radialGradient id="page" cx="0.75" cy="0.25" r="1">
			<stop offset="0" stop-color="#2b4c6e" />
			<stop offset="0.7" stop-color="#101b28" />
		</radialGradient>
		<clipPath id="world"><circle cx="128" cy="128" r="84" /></clipPath>
	</defs>
	<rect width="256" height="256" rx="58" fill="url(#bg)" />
	<g clip-path="url(#world)">
		<rect x="44" y="44" width="54" height="168" fill="url(#side)" />
		<rect x="108" y="44" width="104" height="168" fill="url(#page)" />
	</g>
	<circle cx="128" cy="128" r="83" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="2" />
</svg>
