    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="05-find"]');
        var q = function (sel) { return root.querySelector(sel); };
        var qa = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };

        var stars = q('#f05-find-stars');
        var stage = q('#f05-find-stage');
        var words = qa('.f05-find-word');
        var cmd = q('#f05-find-cmd');
        var search = q('#f05-find-search');
        var cmdKeys = qa('.f05-find-cmd-key');
        var searchKeys = qa('.f05-find-search-key');

        var tl = gsap.timeline({ paused: true });

        // Ground: stars drift a few px; slow camera push-in under the whole shot.
        tl.fromTo(stars, { x: 0, y: 0 }, { x: -10, y: -4, duration: 5.5, ease: "none" }, 0);
        tl.fromTo(stage, { scale: 1 }, { scale: 1.022, duration: 5.5, ease: "sine.inOut" }, 0);

        // Scene 1 (0.0-1.0s): headline reveals per word.
        words.forEach(function (w, i) {
          tl.fromTo(w,
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
            0.12 + i * 0.07);
        });

        // Scene 2 (1.0-2.6s): command bar crop pops into the left 60% (smooth settle).
        tl.fromTo(cmd,
          { scale: 0.35, opacity: 0, y: 32 },
          { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          1.0);
        cmdKeys.forEach(function (k, i) {
          tl.fromTo(k,
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            1.55 + i * 0.08);
        });

        // Scene 3 (2.6-4.0s): search crop pops into the right side, tops aligned.
        tl.fromTo(search,
          { scale: 0.35, opacity: 0, y: 32 },
          { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          2.6);
        searchKeys.forEach(function (k, i) {
          tl.fromTo(k,
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            3.15 + i * 0.08);
        });

        // Scene 4 (4.0-5.5s): hold both; the push-in carries the rest. No exit.
        tl.set({}, {}, 5.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["05-find"] = tl;
      })();
