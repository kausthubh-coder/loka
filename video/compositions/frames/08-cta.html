  <div id="root" data-composition-id="08-cta" data-width="1920" data-height="1080">
    <!-- full-bleed ground: sky (H = 200) + star field -->
    <div id="f08-cta-sky" class="clip" data-start="0" data-duration="5.5" data-track-index="0">
      <img id="f08-cta-stars" src="assets/stars.svg" alt="" />
    </div>

    <div id="f08-cta-stage" class="clip" data-start="0" data-duration="5.5" data-track-index="1">
      <div id="f08-cta-content">
        <div id="f08-cta-lockup">
          <div id="f08-cta-mark">
            <svg viewBox="0 0 64 64" width="220" height="220" aria-hidden="true">
              <defs>
                <clipPath id="cta08-disk-clip"><circle cx="30" cy="34" r="25" /></clipPath>
              </defs>
              <!-- Build (H 200), base layer -->
              <g data-mark-color="build">
                <g data-part="body">
                  <circle cx="30" cy="34" r="25" fill="hsl(200 45% 24%)" />
                  <g clip-path="url(#cta08-disk-clip)">
                    <circle data-part="lit" cx="19" cy="24" r="31" fill="hsl(200 85% 72%)" />
                  </g>
                </g>
                <circle data-part="moon" cx="55" cy="10" r="4.5" fill="hsl(200 85% 72%)" />
              </g>
              <!-- School (H 30) -->
              <g data-mark-color="school">
                <g data-part="body">
                  <circle cx="30" cy="34" r="25" fill="hsl(30 45% 24%)" />
                  <g clip-path="url(#cta08-disk-clip)">
                    <circle data-part="lit" cx="19" cy="24" r="31" fill="hsl(30 85% 72%)" />
                  </g>
                </g>
                <circle data-part="moon" cx="55" cy="10" r="4.5" fill="hsl(30 85% 72%)" />
              </g>
              <!-- Home (H 150) -->
              <g data-mark-color="home">
                <g data-part="body">
                  <circle cx="30" cy="34" r="25" fill="hsl(150 45% 24%)" />
                  <g clip-path="url(#cta08-disk-clip)">
                    <circle data-part="lit" cx="19" cy="24" r="31" fill="hsl(150 85% 72%)" />
                  </g>
                </g>
                <circle data-part="moon" cx="55" cy="10" r="4.5" fill="hsl(150 85% 72%)" />
              </g>

        <div id="f08-cta-tagline">Every space is its own world.</div>

        <div id="f08-cta-cta">
          <div id="f08-cta-pill">Join the waitlist</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const WAITLIST_URL = "loka.example/waitlist";

      const byId = (id) => document.getElementById(id);
      const stars = byId("f08-cta-stars");
      const content = byId("f08-cta-content");
      const stage = byId("f08-cta-stage");
      const mark = byId("f08-cta-mark");
      const wordWrap = byId("f08-cta-word-wrap");
      const wordmark = byId("f08-cta-wordmark");
      const tagline = byId("f08-cta-tagline");
      const pill = byId("f08-cta-pill");
      const url = byId("f08-cta-url");

      url.textContent = WAITLIST_URL;

      const layer = (name) => mark.querySelector('[data-mark-color="' + name + '"]');
      const schoolLayer = layer("school");
      const homeLayer = layer("home");
      const bodies = mark.querySelectorAll('[data-part="body"]');
      const lits = mark.querySelectorAll('[data-part="lit"]');
      const moons = mark.querySelectorAll('[data-part="moon"]');

      // The mark starts alone at frame center, then slides left as the wordmark joins.
      const GAP = 44;
      const wordW = wordWrap.offsetWidth || 300;
      const MARK_SOLO_X = (GAP + wordW) / 2;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Ground: stars drift a few px across the whole frame.
      tl.fromTo(stars, { x: 0, y: 0 }, { x: -4, y: -6, duration: 5.5, ease: "none" }, 0);

      // ---- Scene 1 (0.0-1.4s): the mark builds from its parts on the cleared stage ----
      tl.set(mark, { x: MARK_SOLO_X }, 0);

      // dark disk scales in
      tl.fromTo(
        bodies,
        { scale: 0, opacity: 0, svgOrigin: "30 34" },
        { scale: 1, opacity: 1, svgOrigin: "30 34", duration: 0.6, ease: "power3.out" },
        0.05,
      );
      // lit crescent wipes across the disk from the top left
      tl.fromTo(
        lits,
        { x: -40, y: -40 },
        { x: 0, y: 0, duration: 0.7, ease: "power3.out" },
        0.32,
      );
      // moon pops in last (spring-pop-entrance, smooth)
      tl.fromTo(
        moons,
        { scale: 0, opacity: 0, svgOrigin: "55 10" },
        { scale: 1, opacity: 1, svgOrigin: "55 10", duration: 0.5, ease: "power3.out" },
        0.88,
      );

      // color crossfade once: Build -> School -> Home -> Build
      tl.fromTo(schoolLayer, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.inOut" }, 0.3);
      tl.fromTo(homeLayer, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.inOut" }, 0.64);
      tl.set(schoolLayer, { opacity: 0 }, 0.92);
      tl.to(homeLayer, { opacity: 0, duration: 0.36, ease: "power2.inOut" }, 1.0);

      // ---- Scene 2 (1.4-2.6s): wordmark slides out beside the mark, tagline under ----
      tl.fromTo(
        mark,
        { x: MARK_SOLO_X },
        { x: 0, duration: 0.75, ease: "expo.out", immediateRender: false },
        1.4,
      );
      tl.fromTo(
        wordWrap,
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "expo.out" },
        1.44,
      );
      tl.fromTo(
        wordmark,
        { x: -120, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.75, ease: "expo.out" },
        1.44,
      );
      tl.fromTo(
        tagline,
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        1.98,
      );

      // ---- Scene 3 (2.6-4.0s): CTA pill, then the URL beneath it ----
      tl.fromTo(
        pill,
        { y: 24, scale: 0.96, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        2.6,
      );
      tl.fromTo(
        url,
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        2.98,
      );

      // ---- Scene 4 (4.0-5.5s): hold with a near-imperceptible push, then a quiet settle ----
      tl.fromTo(content, { scale: 1 }, { scale: 1.012, duration: 3.4, ease: "none" }, 2.1);
      tl.fromTo(stage, { opacity: 1 }, { opacity: 0.84, duration: 0.4, ease: "sine.inOut" }, 5.1);

      window.__timelines["08-cta"] = tl;
    })();
  </script>
