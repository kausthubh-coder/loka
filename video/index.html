<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #06090d;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="42.5"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-intro"
        class="scene"
        data-composition-id="02-intro"
        data-composition-src="compositions/frames/02-intro.html"
        data-start="4.5"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-spaces"
        class="scene"
        data-composition-id="03-spaces"
        data-composition-src="compositions/frames/03-spaces.html"
        data-start="9.5"
        data-duration="8.6"
        data-track-index="0"
      ></div>

      <div
        id="el-04-folders"
        class="scene"
        data-composition-id="04-folders"
        data-composition-src="compositions/frames/04-folders.html"
        data-start="17.5"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-find"
        class="scene"
        data-composition-id="05-find"
        data-composition-src="compositions/frames/05-find.html"
        data-start="22"
        data-duration="6"
        data-track-index="0"
      ></div>

      <div
        id="el-06-more"
        class="scene"
        data-composition-id="06-more"
        data-composition-src="compositions/frames/06-more.html"
        data-start="27.5"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-helium"
        class="scene"
        data-composition-id="07-helium"
        data-composition-src="compositions/frames/07-helium.html"
        data-start="32.5"
        data-duration="4.9"
        data-track-index="0"
      ></div>

      <div
        id="el-08-cta"
        class="scene"
        data-composition-id="08-cta"
        data-composition-src="compositions/frames/08-cta.html"
        data-start="37"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.loop.mp3"
        data-start="0"
        data-duration="42.5"
        data-track-index="11"
        data-volume="0.9"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4.5);
        tl.fromTo("#el-02-intro", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4.5);
        tl.to("#el-03-spaces", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 17.5);
        tl.fromTo("#el-04-folders", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 17.5);
        tl.to("#el-04-folders", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 22);
        tl.fromTo("#el-05-find", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 22);
        tl.to("#el-05-find", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 27.5);
        tl.fromTo("#el-06-more", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 27.5);
        tl.to("#el-06-more", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 32.5);
        tl.fromTo("#el-07-helium", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 32.5);
        tl.to("#el-07-helium", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 37);
        tl.fromTo("#el-08-cta", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 37);
        tl.to({}, { duration: 42.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
